<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KarmaBase64 — Web Investigator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
header { text-align: center; margin-bottom: 30px; }
header h1 { font-size: 28px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
header p { color: #64748b; font-size: 14px; }

.input-bar { display: flex; gap: 10px; margin-bottom: 20px; }
.input-bar input { flex: 1; padding: 14px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: #f1f5f9; font-size: 15px; outline: none; }
.input-bar input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
.input-bar button { padding: 14px 24px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-size: 15px; transition: all 0.2s; }
.input-bar button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.3); }
.input-bar button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.disclaimer { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; margin-bottom: 20px; font-size: 13px; color: #94a3b8; }
.disclaimer strong { color: #fbbf24; }

.status { text-align: center; padding: 12px; margin-bottom: 16px; border-radius: 8px; font-weight: 600; display: none; }
.status.scanning { display: block; background: #1e3a5f; color: #60a5fa; }
.status.done { display: block; background: #14532d; color: #4ade80; }

.results { display: grid; gap: 16px; }
.section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
.section-header { padding: 14px 18px; background: #334155; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.section-header .icon { font-size: 18px; }
.section-body { padding: 16px 18px; }

.check-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
.check-row:last-child { border-bottom: none; }
.check-row .name { color: #cbd5e1; }
.check-row .val { font-family: monospace; font-size: 13px; }

.badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.badge.ok { background: #14532d; color: #4ade80; }
.badge.warn { background: #78350f; color: #fbbf24; }
.badge.bad { background: #7f1d1d; color: #f87171; }
.badge.info { background: #1e3a5f; color: #60a5fa; }

.loading { text-align: center; padding: 40px; color: #64748b; }
.spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.progress { height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; margin: 10px 0; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s; }

.found-list { font-family: monospace; font-size: 13px; }
.found-item { padding: 6px 0; display: flex; align-items: center; gap: 8px; }
.found-item a { color: #60a5fa; text-decoration: none; }
.found-item a:hover { text-decoration: underline; }

.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.summary-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; text-align: center; }
.summary-card .num { font-size: 28px; font-weight: 700; }
.summary-card .label { font-size: 11px; color: #64748b; margin-top: 4px; text-transform: uppercase; }

footer { text-align: center; margin-top: 30px; color: #475569; font-size: 12px; }
footer a { color: #667eea; text-decoration: none; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🔍 KarmaBase64 Web Investigator</h1>
    <p>Analisa segurança, arquivos expostos, headers e API de qualquer site</p>
  </header>

  <div class="disclaimer">
    ⚠️ <strong>Aviso:</strong> Use apenas em sites próprios ou com autorização. Ferramenta educacional.
  </div>

  <div class="input-bar">
    <input type="text" id="url-input" placeholder="https://exemplo.com" value="">
    <button id="scan-btn" onclick="startScan()">Investigar</button>
  </div>

  <div class="progress" id="progress" style="display:none;">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div class="status" id="status"></div>

  <div class="summary" id="summary" style="display:none;">
    <div class="summary-card"><div class="num" id="sum-ok" style="color:#4ade80">0</div><div class="label">OK</div></div>
    <div class="summary-card"><div class="num" id="sum-warn" style="color:#fbbf24">0</div><div class="label">Avisos</div></div>
    <div class="summary-card"><div class="num" id="sum-bad" style="color:#f87171">0</div><div class="label">Críticos</div></div>
    <div class="summary-card"><div class="num" id="sum-info" style="color:#60a5fa">0</div><div class="label">Info</div></div>
  </div>

  <div class="results" id="results"></div>

  <footer>
    <p>🔗 <a href="https://karmabase64.blogspot.com/" target="_blank">karmabase64.blogspot.com</a> — технологии без воды</p>
  </footer>
</div>

<script>
// ============================================================
//  WEB INVESTIGATOR — Scanner client-side
// ============================================================

const resultsDiv = document.getElementById('results');
const statusDiv = document.getElementById('status');
const progressBar = document.getElementById('progress');
const progressFill = document.getElementById('progress-bar');
const summaryDiv = document.getElementById('summary');

let stats = { ok: 0, warn: 0, bad: 0, info: 0 };

function updateProgress(pct) {
  progressFill.style.width = pct + '%';
}

function setStatus(text, type) {
  statusDiv.textContent = text;
  statusDiv.className = 'status ' + type;
}

function addResult(icon, title) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<div class="section-header"><span class="icon">${icon}</span> ${title}</div><div class="section-body" id="sec-${title.replace(/\s/g,'')}"></div>`;
  resultsDiv.appendChild(sec);
  return sec.querySelector('.section-body');
}

function row(body, name, value, badgeType, badgeText) {
  const r = document.createElement('div');
  r.className = 'check-row';
  r.innerHTML = `<span class="name">${name}</span><span class="val"><span class="badge ${badgeType}">${badgeText}</span> ${value || ''}</span>`;
  body.appendChild(r);
}

function badge(type, text) { return `<span class="badge ${type}">${text}</span>`; }

// ============================================================
//  1. VERIFICAÇÃO DE HEADERS DE SEGURANÇA
// ============================================================
async function checkSecurityHeaders(url) {
  const body = addResult('🛡️', 'Headers de Segurança');
  let checks = { ok: 0, warn: 0, bad: 0 };

  try {
    const resp = await fetch(url, { method: 'GET', mode: 'cors' });
    const headers = resp.headers;

    const securityHeaders = [
      { key: 'strict-transport-security', name: 'HSTS', desc: 'Força HTTPS' },
      { key: 'x-frame-options', name: 'X-Frame-Options', desc: 'Previne clickjacking' },
      { key: 'x-content-type-options', name: 'X-Content-Type', desc: 'Previne MIME sniffing' },
      { key: 'content-security-policy', name: 'CSP', desc: 'Content Security Policy' },
      { key: 'x-xss-protection', name: 'X-XSS-Protection', desc: 'Filtro XSS' },
      { key: 'referrer-policy', name: 'Referrer-Policy', desc: 'Controla referrer' },
      { key: 'permissions-policy', name: 'Permissions-Policy', desc: 'Permissões do browser' }
    ];

    for (const h of securityHeaders) {
      const val = headers.get(h.key);
      if (val) {
        row(body, h.name, h.desc, 'ok', '✅ Presente');
        checks.ok++;
      } else {
        row(body, h.name, h.desc, 'warn', '⚠️ Ausente');
        checks.warn++;
      }
    }

    // Server header (info)
    const server = headers.get('server');
    if (server) {
      row(body, 'Server', server, 'info', 'ℹ️ Detectado');
      checks.info++;
    }

    // X-Powered-By (vulnerabilidade de info)
    const poweredBy = headers.get('x-powered-by');
    if (poweredBy) {
      row(body, 'X-Powered-By', poweredBy, 'bad', '🚨 Expõe tech');
      checks.bad++;
    }

    return { checks, headers, status: resp.status };
  } catch (e) {
    row(body, 'Fetch', 'CORS bloqueou leitura de headers', 'info', 'ℹ️ Limitado');
    return { checks, headers: null, status: null, error: true };
  }
}

// ============================================================
//  2. PROcura DE ARQUIVOS EXPOSTOS
// ============================================================
async function checkExposedFiles(baseUrl) {
  const body = addResult('📂', 'Arquivos Expostos');
  const files = [
    '/robots.txt', '/sitemap.xml', '/.env', '/.git/config',
    '/.htaccess', '/wp-config.php', '/package.json',
    '/composer.json', '/.DS_Store', '/crossdomain.xml',
    '/server-status', '/.svn/entries', '/web.config',
    '/backup.sql', '/dump.sql', '/.gitignore'
  ];

  let found = 0;

  for (let i = 0; i < files.length; i++) {
    updateProgress(((i + 1) / files.length * 100).toFixed(0));
    const path = files[i];
    try {
      const resp = await fetch(baseUrl + path, { method: 'GET', mode: 'no-cors' });
      // no-cors sempre retorna opaco, mas se não der erro de rede, o arquivo pode existir
      // Tentamos com modo cors para arquivos de texto
    } catch (e) {
      // arquivo não existe
    }

    // Método alternativo: tenta carregar como imagem/script para detectar existência
    const exists = await checkUrlExists(baseUrl + path);
    if (exists) {
      const item = document.createElement('div');
      item.className = 'found-item';
      item.innerHTML = `${badge(exposedFileSeverity(path), severityLabel(path))} <a href="${baseUrl}${path}" target="_blank">${path}</a>`;
      body.appendChild(item);
      found++;
      if (path === '/.env' || path === '/.git/config' || path === '/wp-config.php' || path === '/backup.sql' || path === '/dump.sql') {
        stats.bad++;
      } else if (path === '/.htaccess' || path === '/web.config' || path === '/.DS_Store' || path === '/.svn/entries') {
        stats.warn++;
      } else {
        stats.info++;
      }
    }
  }

  if (found === 0) {
    body.innerHTML = '<div style="color:#4ade80; font-size:13px;">✅ Nenhum arquivo sensível exposto</div>';
    stats.ok++;
  }
}

function exposedFileSeverity(path) {
  const critical = ['/.env', '/.git/config', '/wp-config.php', '/backup.sql', '/dump.sql', '/server-status'];
  const warning = ['/.htaccess', '/web.config', '/.DS_Store', '/.svn/entries', '/composer.json', '/package.json'];
  if (critical.some(c => path.includes(c))) return 'bad';
  if (warning.some(w => path.includes(w))) return 'warn';
  return 'info';
}

function severityLabel(path) {
  const s = exposedFileSeverity(path);
  return s === 'bad' ? '🚨' : s === 'warn' ? '⚠️' : 'ℹ️';
}

// Detecta se URL existe (via Image ou fetch)
function checkUrlExists(url) {
  return new Promise((resolve) => {
    // Tenta fetch com timeout
    const controller = new AbortController();
    const timeout = setTimeout(() => { controller.abort(); resolve(false); }, 3000);

    fetch(url, { method: 'HEAD', signal: controller.signal, mode: 'no-cors' })
      .then(() => { clearTimeout(timeout); resolve(true); })
      .catch(() => {
        // HEAD pode falhar por CORS, tenta GET
        fetch(url, { method: 'GET', signal: controller.signal, mode: 'no-cors' })
          .then(() => { clearTimeout(timeout); resolve(true); })
          .catch(() => { clearTimeout(timeout); resolve(false); });
      });
  });
}

// ============================================================
//  3. CORS CHECK
// ============================================================
async function checkCORS(url) {
  const body = addResult('🌐', 'CORS Policy');
  try {
    const resp = await fetch(url, { method: 'GET', mode: 'cors' });
    const acao = resp.headers.get('access-control-allow-origin');

    if (acao === '*') {
      row(body, 'Access-Control-Allow-Origin', '*', 'bad', '🚨 Aberto');
      stats.bad++;
    } else if (acao) {
      row(body, 'Access-Control-Allow-Origin', acao, 'ok', '✅ Restrito');
      stats.ok++;
    } else {
      row(body, 'CORS', 'Não configurado', 'info', 'ℹ️ N/A');
      stats.info++;
    }

    const creds = resp.headers.get('access-control-allow-credentials');
    if (creds === 'true' && acao === '*') {
      row(body, 'Allow-Credentials', 'true + *', 'bad', '🚨 Perigoso');
      stats.bad++;
    }
  } catch (e) {
    row(body, 'CORS', 'Bloqueado (same-origin)', 'info', 'ℹ️ N/A');
    stats.info++;
  }
}

// ============================================================
//  4. API ENDPOINTS PROBE
// ============================================================
async function checkApiEndpoints(baseUrl) {
  const body = addResult('🔌', 'API Endpoints');
  const endpoints = [
    '/api', '/api/v1', '/api/v2', '/api/users',
    '/api/login', '/api/auth', '/api/health',
    '/api/status', '/api/config', '/api/debug',
    '/graphql', '/rest', '/swagger.json',
    '/api-docs', '/openapi.json', '/.well-known/security.txt'
  ];

  let found = 0;

  for (const ep of endpoints) {
    const exists = await checkUrlExists(baseUrl + ep);
    if (exists) {
      const item = document.createElement('div');
      item.className = 'found-item';
      const isSensitive = ['/api/debug', '/api/config', '/api/users'].includes(ep);
      item.innerHTML = `${badge(isSensitive ? 'warn' : 'info', isSensitive ? '⚠️' : 'ℹ️')} <a href="${baseUrl}${ep}" target="_blank">${ep}</a>`;
      body.appendChild(item);
      found++;
      if (isSensitive) stats.warn++; else stats.info++;
    }
  }

  if (found === 0) {
    body.innerHTML = '<div style="color:#64748b; font-size:13px;">Nenhum endpoint API detectado</div>';
    stats.info++;
  }
}

// ============================================================
//  5. TECNOLOGIAS DETECTADAS
// ============================================================
async function detectTech(url) {
  const body = addResult('⚙️', 'Tecnologias');
  let detected = [];

  try {
    const resp = await fetch(url, { mode: 'cors' });
    const text = await resp.text();
    const headers = resp.headers;

    // WordPress
    if (text.includes('wp-content') || text.includes('wp-includes')) detected.push({ name: 'WordPress', risk: 'info' });
    // React
    if (text.includes('__NEXT_DATA__') || text.includes('react')) detected.push({ name: 'React/Next.js', risk: 'info' });
    // jQuery
    if (text.includes('jquery')) detected.push({ name: 'jQuery', risk: 'info' });
    // Bootstrap
    if (text.includes('bootstrap')) detected.push({ name: 'Bootstrap', risk: 'info' });
    // Angular
    if (text.includes('ng-app') || text.includes('angular')) detected.push({ name: 'Angular', risk: 'info' });
    // Vue
    if (text.includes('vue') || text.includes('__vue__')) detected.push({ name: 'Vue.js', risk: 'info' });

    // Server
    const server = headers.get('server');
    if (server) detected.push({ name: 'Server: ' + server, risk: 'info' });

    // Versão exposta no server
    if (server && /\d/.test(server)) detected.push({ name: 'Versão do servidor exposta', risk: 'warn' });

    // X-Powered-By
    const powered = headers.get('x-powered-by');
    if (powered) detected.push({ name: 'Powered by: ' + powered, risk: 'bad' });

    // Formulários
    if (text.includes('<form')) detected.push({ name: 'Formulários HTML detectados', risk: 'info' });
    // Inputs hidden
    if (text.includes('type="hidden"')) detected.push({ name: 'Campos hidden em formulários', risk: 'warn' });
    // iframes
    if (text.includes('<iframe')) detected.push({ name: 'Iframes presentes', risk: 'info' });

  } catch (e) {
    detected.push({ name: 'CORS bloqueou análise do HTML', risk: 'info' });
  }

  if (detected.length === 0) {
    body.innerHTML = '<div style="color:#64748b; font-size:13px;">Nada detectado</div>';
  } else {
    detected.forEach(d => {
      row(body, d.name, '', d.risk, d.risk === 'bad' ? '🚨' : d.risk === 'warn' ? '⚠️' : 'ℹ️');
      if (d.risk === 'bad') stats.bad++; else if (d.risk === 'warn') stats.warn++; else stats.info++;
    });
  }
}

// ============================================================
//  6. CERTIFICADO SSL / HTTPS
// ============================================================
async function checkSSL(url) {
  const body = addResult('🔒', 'SSL / HTTPS');
  const isHttps = url.startsWith('https://');

  if (!isHttps) {
    row(body, 'Protocolo', 'HTTP (sem HTTPS)', 'bad', '🚨 Inseguro');
    stats.bad++;
    return;
  }

  row(body, 'HTTPS', 'Ativo', 'ok', '✅ Sim');
  stats.ok++;

  try {
    const resp = await fetch(url, { mode: 'cors' });
    // Se chegou aqui, o cert é válido
    row(body, 'Certificado', 'Válido (não houve erro)', 'ok', '✅ OK');
    stats.ok++;
  } catch (e) {
    if (e.message.includes('certificate') || e.message.includes('SSL')) {
      row(body, 'Certificado', 'Pode estar inválido', 'bad', '🚨 Verificar');
      stats.bad++;
    } else {
      row(body, 'Certificado', 'Não foi possível verificar (CORS)', 'info', 'ℹ️ N/A');
      stats.info++;
    }
  }

  // HSTS
  try {
    const resp = await fetch(url, { mode: 'cors' });
    const hsts = resp.headers.get('strict-transport-security');
    if (hsts) {
      row(body, 'HSTS', hsts, 'ok', '✅ Ativo');
      stats.ok++;
    } else {
      row(body, 'HSTS', 'Não configurado', 'warn', '⚠️ Ausente');
      stats.warn++;
    }
  } catch (e) {
    row(body, 'HSTS', 'Não verificável', 'info', 'ℹ️ N/A');
    stats.info++;
  }
}

// ============================================================
//  7. PERFORMANCE / TAMANHO DA PÁGINA
// ============================================================
async function checkPerformance(url) {
  const body = addResult('⚡', 'Performance');
  const start = performance.now();

  try {
    const resp = await fetch(url, { mode: 'cors' });
    const end = performance.now();
    const loadTime = (end - start).toFixed(0);

    if (loadTime < 500) {
      row(body, 'Tempo de carga', loadTime + 'ms', 'ok', '✅ Rápido');
      stats.ok++;
    } else if (loadTime < 2000) {
      row(body, 'Tempo de carga', loadTime + 'ms', 'warn', '⚠️ Médio');
      stats.warn++;
    } else {
      row(body, 'Tempo de carga', loadTime + 'ms', 'bad', '🚨 Lento');
      stats.bad++;
    }

    const contentLength = resp.headers.get('content-length');
    if (contentLength) {
      const kb = (parseInt(contentLength) / 1024).toFixed(1);
      row(body, 'Tamanho', kb + 'KB', kb < 500 ? 'ok' : 'warn', kb < 500 ? '✅' : '⚠️');
      if (kb < 500) stats.ok++; else stats.warn++;
    }

    row(body, 'Status HTTP', resp.status, resp.status < 400 ? 'ok' : 'bad', resp.status < 400 ? '✅' : '🚨');
    if (resp.status < 400) stats.ok++; else stats.bad++;

  } catch (e) {
    row(body, 'Performance', 'CORS bloqueou', 'info', 'ℹ️ N/A');
    stats.info++;
  }
}

// ============================================================
//  SCAN PRINCIPAL
// ============================================================
async function startScan() {
  let url = document.getElementById('url-input').value.trim();
  if (!url) { alert('Insere um URL'); return; }
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
  }
  // Remove trailing slash
  url = url.replace(/\/$/, '');

  const btn = document.getElementById('scan-btn');
  btn.disabled = true;
  btn.textContent = 'A investigar...';
  resultsDiv.innerHTML = '';
  stats = { ok: 0, warn: 0, bad: 0, info: 0 };
  summaryDiv.style.display = 'none';
  progressBar.style.display = 'block';
  updateProgress(0);

  setStatus('🔍 A investigar ' + url + '...', 'scanning');

  // 1. SSL
  await checkSSL(url);
  updateProgress(15);

  // 2. Headers
  await checkSecurityHeaders(url);
  updateProgress(30);

  // 3. CORS
  await checkCORS(url);
  updateProgress(45);

  // 4. Arquivos expostos
  setStatus('📂 À procura de arquivos expostos...', 'scanning');
  await checkExposedFiles(url);
  updateProgress(65);

  // 5. API endpoints
  setStatus('🔌 À procurar endpoints de API...', 'scanning');
  await checkApiEndpoints(url);
  updateProgress(80);

  // 6. Tecnologias
  setStatus('⚙️ A detetar tecnologias...', 'scanning');
  await detectTech(url);
  updateProgress(90);

  // 7. Performance
  setStatus('⚡ A medir performance...', 'scanning');
  await checkPerformance(url);
  updateProgress(100);

  // Resumo
  document.getElementById('sum-ok').textContent = stats.ok;
  document.getElementById('sum-warn').textContent = stats.warn;
  document.getElementById('sum-bad').textContent = stats.bad;
  document.getElementById('sum-info').textContent = stats.info;
  summaryDiv.style.display = 'grid';

  setStatus('✅ Investigação completa! Verifica os resultados abaixo.', 'done');

  btn.disabled = false;
  btn.textContent = 'Investigar';
  progressBar.style.display = 'none';

  console.log('%c🔍 Scan completo: ' + url, 'color:#667eea; font-weight:bold;');
  console.log('Stats:', stats);
}

// Enter key
document.getElementById('url-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startScan();
});
</script>

</body>
</html>
